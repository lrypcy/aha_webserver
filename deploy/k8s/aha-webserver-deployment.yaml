apiVersion: apps/v1
kind: Deployment
metadata:
  name: aha-webserver
  namespace: aha
  labels:
    easydeploy.io/managed: "true"
    easydeploy.io/service: aha-webserver
    easydeploy.io/target: k8s
    easydeploy.io/stack: aha-webserver
    app: aha
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      easydeploy.io/service: aha-webserver
  template:
    metadata:
      labels:
        easydeploy.io/managed: "true"
        easydeploy.io/service: aha-webserver
        easydeploy.io/target: k8s
        easydeploy.io/stack: aha-webserver
        app: aha
        tier: backend
    spec:
      containers:
        - name: aha-webserver
          image: "aha_webserver:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: aha-webserver-env
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
