# Secret 模板：只含占位值，禁止写入真实密钥。
# 真实 Secret 由 easy_deploy 在 .easy_deploy/generated/k8s/ 生成（0600，不入库），
# 或由集群侧 sealed-secret / external-secret 注入。
apiVersion: v1
kind: Secret
metadata:
  name: aha-webserver-env
  namespace: aha
  labels:
    easydeploy.io/managed: "true"
    easydeploy.io/service: aha-webserver
    easydeploy.io/target: k8s
type: Opaque
stringData:
  AHA_SERVER_PORT: "8080"
  AHA_SERVER_ENV: "dev"
  AHA_DB_TYPE: "sqlite"
  AHA_DB_NAME: "aha.db"
  AHA_LOG_LEVEL: "info"
  AHA_CORS_ORIGINS: "http://localhost:3000"
  # AHA_JWT_SECRET / AHA_DB_PASSWORD：生产必填，只从环境变量注入，不写入本文件
